name: disposable-integration
on:
  workflow_dispatch:
    inputs:
      profile:
        description: SQL qualification profile for the reviewed source
        type: choice
        required: true
        default: full
        options:
          - full
          - data-core-ingestion-v1
          - data-core-refresh-v1
          - data-ingestion-guards-v1
          - data-official-preconfiguration-v1
          - data-live-league-two-v1
          - data-live-public-intake-v1
  push:
    branches:
      - 'codex/integration-qualification-*'
permissions:
  contents: read
concurrency:
  group: integration-test
  cancel-in-progress: false
jobs:
  integration:
    if: github.repository == 'clawmachinejed/league-one-audit'
    environment: integration-test
    runs-on: ubuntu-latest
    # Preserve ten minutes around the supervisor's fixed 40-minute lifecycle deadline.
    timeout-minutes: 50
    steps:
      # Approvers review this exact selected head, including workflow, supervisor,
      # tests and dependencies. No untrusted fork or automatic PR trigger.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify the approved checkout identity
        shell: bash
        env:
          REVIEWED_SHA: ${{ github.sha }}
        run: |
          [[ "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          git rev-parse HEAD
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run the disposable SQL gate
        shell: bash
        run: |
          case "$GITHUB_EVENT_NAME:$QUALIFICATION_PROFILE" in
            push:|workflow_dispatch:full)
              pnpm test:integration
              ;;
            workflow_dispatch:data-core-ingestion-v1)
              pnpm test:integration --profile=data-core-ingestion-v1
              ;;
            workflow_dispatch:data-core-refresh-v1)
              pnpm test:integration --profile=data-core-refresh-v1
              ;;
            workflow_dispatch:data-ingestion-guards-v1)
              pnpm test:integration --profile=data-ingestion-guards-v1
              ;;
            workflow_dispatch:data-official-preconfiguration-v1)
              pnpm test:integration --profile=data-official-preconfiguration-v1
              ;;
            workflow_dispatch:data-live-league-two-v1)
              pnpm test:integration --profile=data-live-league-two-v1
              ;;
            workflow_dispatch:data-live-public-intake-v1)
              pnpm test:integration --profile=data-live-public-intake-v1
              ;;
            *)
              echo 'Unsupported qualification event or profile.' >&2
              exit 1
              ;;
          esac
        env:
          CI: '1'
          QUALIFICATION_PROFILE: ${{ inputs.profile }}
          NEON_TEST_AUTHORIZATION: ${{ vars.NEON_TEST_AUTHORIZATION }}
          NEON_TEST_API_KEY: ${{ secrets.NEON_TEST_API_KEY }}
          NEON_TEST_PROJECT_ID: ${{ vars.NEON_TEST_PROJECT_ID }}
          NEON_TEST_PROJECT_NAME: ${{ vars.NEON_TEST_PROJECT_NAME }}
          NEON_TEST_PARENT_BRANCH_ID: ${{ vars.NEON_TEST_PARENT_BRANCH_ID }}
          NEON_TEST_PARENT_BRANCH_NAME: ${{ vars.NEON_TEST_PARENT_BRANCH_NAME }}
          NEON_TEST_DATABASE: ${{ vars.NEON_TEST_DATABASE }}
          NEON_TEST_OWNER_ROLE: ${{ vars.NEON_TEST_OWNER_ROLE }}
      - name: Preserve sanitized integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            test-results/integration/*.json
            test-results/integration/artifacts/**/*.json
          if-no-files-found: warn
          retention-days: 14
