name: verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/setup@v2
        with:
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
        env:
          NEXT_TELEMETRY_DISABLED: '1'
